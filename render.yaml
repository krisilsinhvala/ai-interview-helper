services:
  - type: web
    name: prepmind-ai
    runtime: node
    rootDir: backend
    buildCommand: bash render-build.sh
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false       # Set this manually in Render dashboard
      - key: JWT_SECRET
        sync: false       # Set this manually in Render dashboard
      - key: GOOGLE_GENAI_API_KEY
        sync: false       # Set this manually in Render dashboard
